  <script>
(function () {
  var statusEl = document.getElementById('admin-status');
  var wrapEl = document.getElementById('orders-wrap');
  var bodyEl = document.getElementById('orders-body');
  var results = {};

  function pick(source, keys) {
    for (var i = 0; i < keys.length; i += 1) {
      var value = source[keys[i]];
      if (value !== undefined && value !== null && value !== '') return value;
    }
    return '';
  }

  function money(value) {
    var n = Number(value);
    if (value === '' || !Number.isFinite(n)) return value === '' ? '-' : String(value);
    return 'R' + (Number.isInteger(n) ? String(n) : n.toFixed(2));
  }

  function formatTime(value) {
    if (!value) return '-';
    var d = new Date(value);
    return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
  }

  function showSignIn() {
    wrapEl.classList.add('u-form-control-hidden');
    while (bodyEl.firstChild) bodyEl.removeChild(bodyEl.firstChild);
    statusEl.textContent = 'Sign in through Cloudflare Access';
    statusEl.classList.remove('u-form-control-hidden');
  }

  function showStatus(message) {
    wrapEl.classList.add('u-form-control-hidden');
    statusEl.textContent = message;
    statusEl.classList.remove('u-form-control-hidden');
  }

  function readBody(res) {
    return res.text().then(function (raw) {
      var body = null;
      try { body = JSON.parse(raw); } catch (e) { body = null; }
      return { status: res.status, ok: res.ok, raw: raw, body: body };
    });
  }

  function resultText(result) {
    var body = result.body;
    if (typeof body === 'string') return body;
    if (body && typeof body === 'object') {
      var text = pick(body, ['result', 'message', 'status', 'error']);
      return typeof text === 'string' ? text : JSON.stringify(body);
    }
    return result.raw || 'HTTP ' + result.status;
  }

  function cell(row, text) {
    var td = document.createElement('td');
    td.textContent = text;
    row.appendChild(td);
    return td;
  }

  function markPaid(reference, button, resultEl) {
    button.disabled = true;
    resultEl.textContent = 'Working...';
    fetch('/api/orders/' + encodeURIComponent(reference) + '/mark-paid', {
      method: 'POST',
      headers: { Accept: 'application/json' },
      credentials: 'same-origin'
    })
      .then(readBody)
      .then(function (result) {
        if (result.status === 401) {
          showSignIn();
          return;
        }
        if (!result.ok) {
          resultEl.textContent = 'Error: ' + resultText(result);
          button.disabled = false;
          return;
        }
        results[reference] = resultText(result);
        load();
      })
      .catch(function () {
        resultEl.textContent = 'Error: request failed';
        button.disabled = false;
      });
  }

  function renderOrders(orders) {
    while (bodyEl.firstChild) bodyEl.removeChild(bodyEl.firstChild);
    orders.forEach(function (order) {
      var reference = pick(order, ['reference', 'ref']);
      var status = pick(order, ['status']);
      var type = pick(order, ['type']);
      var row = document.createElement('tr');
      cell(row, reference);
      cell(row, formatTime(pick(order, ['created_at', 'createdAt'])));
      cell(row, status);
      cell(row, pick(order, ['customer_name', 'customerName', 'name']));
      cell(row, pick(order, ['customer_email', 'customerEmail', 'email']));
      cell(row, pick(order, ['product_name', 'productName', 'product', 'product_id']));
      cell(row, money(pick(order, ['total'])));
      cell(row, pick(order, ['delivery_address', 'deliveryAddress']) || '-');
      var actionCell = document.createElement('td');
      var resultEl = document.createElement('span');
      resultEl.textContent = results[reference] || '';
      if (status === 'pending' || (type === 'digital' && status === 'paid')) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'u-border-none u-btn u-button-style u-custom-font u-font-roboto u-hover-palette-1-base u-palette-1-light-3';
        button.textContent = 'Mark paid & send';
        button.addEventListener('click', function () { markPaid(reference, button, resultEl); });
        actionCell.appendChild(button);
        actionCell.appendChild(document.createElement('br'));
      }
      actionCell.appendChild(resultEl);
      row.appendChild(actionCell);
      bodyEl.appendChild(row);
    });
    statusEl.classList.add('u-form-control-hidden');
    wrapEl.classList.remove('u-form-control-hidden');
    if (!orders.length) showStatus('No orders yet.');
  }

  function load() {
    fetch('/api/orders', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(readBody)
      .then(function (result) {
        if (result.status === 401) {
          showSignIn();
          return;
        }
        if (!result.ok) {
          showStatus('Orders could not be loaded: ' + resultText(result));
          return;
        }
        var body = result.body;
        var orders = Array.isArray(body) ? body : body && Array.isArray(body.orders) ? body.orders : null;
        if (!orders) {
          showStatus('Orders could not be loaded: unexpected response.');
          return;
        }
        renderOrders(orders);
      })
      .catch(function () {
        showStatus('Orders could not be loaded. Check your connection and try again.');
      });
  }

  load();
})();
  </script>
